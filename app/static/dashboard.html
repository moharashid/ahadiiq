<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AhadiIQ — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/images/ahadiiq-favicon-32.png">
<link rel="apple-touch-icon" href="/static/images/ahadiiq-favicon-180.png">
<style>
  :root{
    --teal:#0FA3B1;
    --teal-deep:#0B818E;
    --ink:#0B3A42;
    --slate:#27333A;
    --bg:#F6F9FA;
    --surface:#FFFFFF;
    --line:#E6ECEE;
    --line-soft:#EEF2F4;
    --muted:#6A7881;
    --green:#2FB173; --green-soft:#E4F4EC;
    --amber:#C98A1B; --amber-soft:#F7EFDC;
    --red:#D2564B;   --red-soft:#F8E7E4;
    --teal-soft:#E6F6F7;
    --radius:12px;
    --shadow:0 1px 2px rgba(11,58,66,.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--slate);
    font-family:"Inter",system-ui,sans-serif;font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums;}

  /* top bar */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:rgba(246,249,250,.9);backdrop-filter:saturate(1.2) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .wordmark{display:flex;align-items:center;gap:11px;}
  .logo-mark{width:32px;height:32px;border-radius:9px;
    background:linear-gradient(145deg,#12B4C2,#0B818E);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 8px rgba(15,163,177,.28);flex:0 0 auto;}
  .mark-text{font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--ink);}
  .mark-text .iq{color:var(--teal);}
  .tag{font-size:12.5px;color:var(--muted);margin-left:2px;}
  .topbar-right{display:flex;align-items:center;gap:18px;}
  .role-chip{font-size:12.5px;color:var(--teal-deep);border:1px solid var(--line);
    background:var(--surface);padding:4px 11px;border-radius:999px;}
  .logout{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;
    padding:6px 4px;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;}
  .logout:hover{color:var(--ink);border-bottom-color:var(--ink);}

  main{max-width:1180px;margin:0 auto;padding:34px 28px 72px;}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .page-head h1{font-weight:700;font-size:27px;letter-spacing:-.02em;margin:0;color:var(--ink);}
  .page-head .asof{color:var(--muted);font-size:13.5px;}

  /* summary strip */
  .strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;box-shadow:var(--shadow);margin-bottom:30px;}
  .stat{padding:20px 22px;border-left:1px solid var(--line-soft);}
  .stat:first-child{border-left:0;}
  .stat .figure{font-weight:700;font-size:38px;line-height:1;letter-spacing:-.025em;color:var(--ink);}
  .stat .label{margin-top:9px;font-size:13px;color:var(--muted);font-weight:500;}
  .stat.alert .figure{color:var(--red);}
  .stat.warn .figure{color:var(--amber);}

  /* grid */
  .cols{display:grid;grid-template-columns:1.65fr 1fr;gap:24px;margin-bottom:24px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
    padding:17px 22px 14px;border-bottom:1px solid var(--line-soft);}
  .panel-head h2{font-weight:600;font-size:16.5px;letter-spacing:-.01em;margin:0;color:var(--ink);}
  .panel-head .count{font-size:13px;color:var(--muted);}

  /* tables */
  #obl-body,#agr-body{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:440px;}
  thead th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);
    padding:11px 22px;border-bottom:1px solid var(--line-soft);}
  tbody td{padding:14px 22px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  tbody tr.over td{background:var(--red-soft);}
  .otype{font-weight:600;text-transform:capitalize;color:var(--ink);}
  .odoc{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;max-width:30ch;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .due{font-variant-numeric:tabular-nums;}
  .timing{font-size:12.5px;}
  .timing.over{color:var(--red);font-weight:600;}
  .timing.soon{color:var(--amber);font-weight:600;}
  .timing.calm{color:var(--muted);}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;
    border-radius:999px;border:1px solid var(--line);color:var(--slate);background:#fff;text-transform:capitalize;}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .pill.pending .dot{background:var(--amber);}
  .pill.completed .dot{background:var(--green);}
  .pill.validated .dot{background:var(--green);}
  .pill.processing .dot{background:var(--teal);}
  .pill.uploaded .dot{background:var(--muted);}

  /* risks */
  .risk{padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;gap:14px;}
  .risk:last-child{border-bottom:0;}
  .sev{flex:0 0 auto;width:4px;border-radius:3px;background:var(--muted);}
  .sev.s3{background:var(--red);}
  .sev.s2{background:var(--amber);}
  .sev.s1{background:var(--green);}
  .risk-body{min-width:0;}
  .risk-top{display:flex;align-items:center;gap:10px;margin-bottom:5px;}
  .risk-type{font-weight:600;text-transform:capitalize;color:var(--ink);}
  .sev-tag{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:500;}
  .sev-tag.s3{background:var(--red-soft);color:var(--red);}
  .sev-tag.s2{background:var(--amber-soft);color:var(--amber);}
  .sev-tag.s1{background:var(--green-soft);color:var(--green);}
  .risk-desc{font-size:13.5px;color:var(--muted);line-height:1.5;}

  /* agreements */
  .agreements .adoc{font-weight:600;font-size:15px;color:var(--ink);}
  .atype{color:var(--muted);font-size:13px;text-transform:capitalize;margin-top:2px;}
  .rlevel{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-transform:capitalize;}
  .rlevel .bar{width:28px;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;}
  .rlevel .bar i{position:absolute;left:0;top:0;bottom:0;}
  .rlevel.high .bar i{background:var(--red);width:100%;}
  .rlevel.medium .bar i{background:var(--amber);width:66%;}
  .rlevel.low .bar i{background:var(--green);width:33%;}
  .rlevel.none{color:var(--muted);}

  .empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:14px;}
  .empty strong{display:block;color:var(--ink);font-weight:700;margin-bottom:4px;font-size:16px;}

  .loading{opacity:0;}
  .ready{opacity:1;transition:opacity .25s ease;}
  @media (prefers-reduced-motion:reduce){.ready{transition:none;}}

  @media (max-width:860px){
    .cols{grid-template-columns:1fr;}
    .strip{grid-template-columns:repeat(2,1fr);}
    .stat:nth-child(3){border-left:0;}
    .stat:nth-child(n+3){border-top:1px solid var(--line-soft);}
    main{padding:24px 18px 60px;}
    .topbar-inner{padding:12px 18px;}
  }
  @media (max-width:460px){.strip{grid-template-columns:1fr 1fr;}.odoc{max-width:18ch;}.tag{display:none;}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="wordmark">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 40 40" fill="none">
            <path d="M7 21.5 L16 30 L33 11" stroke="#fff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="mark-text">Ahadi<span class="iq">IQ</span></span>
        <span class="tag">Obligation tracking</span>
      </div>
      <div class="topbar-right">
        <span class="role-chip" id="roleChip" hidden></span>
        <a class="logout" href="/auth/logout">Log out</a>
      </div>
    </div>
  </header>

  <main id="app" class="loading">
    <div class="page-head">
      <h1>Overview</h1>
      <span class="asof" id="asof"></span>
    </div>

    <section class="strip" aria-label="Summary">
      <div class="stat"><div class="figure num" id="s-agreements">—</div><div class="label">Agreements</div></div>
      <div class="stat"><div class="figure num" id="s-pending">—</div><div class="label">Pending obligations</div></div>
      <div class="stat" id="stat-overdue"><div class="figure num" id="s-overdue">—</div><div class="label">Overdue</div></div>
      <div class="stat" id="stat-risk"><div class="figure num" id="s-risk">—</div><div class="label">High-risk agreements</div></div>
    </section>

    <div class="cols">
      <section class="panel">
        <div class="panel-head"><h2>Obligations</h2><span class="count" id="obl-count"></span></div>
        <div id="obl-body"><div class="empty">Loading…</div></div>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Risks</h2><span class="count" id="risk-count"></span></div>
        <div id="risk-body"><div class="empty">Loading…</div></div>
      </section>
    </div>

    <section class="panel agreements">
      <div class="panel-head"><h2>Agreements</h2><span class="count" id="agr-count"></span></div>
      <div id="agr-body"><div class="empty">Loading…</div></div>
    </section>
  </main>

<script>
const API = "";
const fmtDate = iso => { if(!iso) return "—"; const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
const daysUntil = iso => { if(!iso) return null; const d=new Date(iso+"T00:00:00"),t=new Date();
  t.setHours(0,0,0,0); return Math.round((d-t)/86400000); };
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function getJSON(path){
  const r = await fetch(API+path,{credentials:"same-origin"});
  if(r.status===401){ window.location="/auth/login"; throw new Error("unauth"); }
  if(!r.ok) throw new Error(path+" "+r.status);
  return r.json();
}
function renderSummary(s){
  document.getElementById("s-agreements").textContent=s.total_agreements??0;
  document.getElementById("s-pending").textContent=s.pending_obligations??0;
  const ov=s.overdue_obligations??0, hr=s.high_risk_agreements??0;
  document.getElementById("s-overdue").textContent=ov;
  document.getElementById("s-risk").textContent=hr;
  if(ov>0) document.getElementById("stat-overdue").classList.add("alert");
  if(hr>0) document.getElementById("stat-risk").classList.add("warn");
}
function timingCell(iso,status){
  const n=daysUntil(iso);
  if(n===null) return '<span class="timing calm">No date</span>';
  if(status!=="completed"&&n<0) return `<span class="timing over">Overdue ${Math.abs(n)}d</span>`;
  if(n<=30) return `<span class="timing soon">in ${n}d</span>`;
  return `<span class="timing calm">in ${n}d</span>`;
}
function renderObligations(rows,docMap){
  document.getElementById("obl-count").textContent=rows.length?rows.length+" total":"";
  const body=document.getElementById("obl-body");
  if(!rows.length){body.innerHTML='<div class="empty"><strong>Nothing due</strong>No obligations are being tracked yet.</div>';return;}
  rows.sort((a,b)=>(a.due_date||"9999").localeCompare(b.due_date||"9999"));
  const trs=rows.map(o=>{
    const overdue=o.status!=="completed"&&daysUntil(o.due_date)!==null&&daysUntil(o.due_date)<0;
    const doc=docMap[o.agreement_id]||o.agreement_id;
    return `<tr class="${overdue?"over":""}">
      <td><span class="otype">${esc(o.obligation_type)}</span><span class="odoc">${esc(doc)}</span></td>
      <td class="due">${fmtDate(o.due_date)}</td>
      <td>${timingCell(o.due_date,o.status)}</td>
      <td><span class="pill ${esc(o.status)}"><span class="dot"></span>${esc(o.status)}</span></td>
    </tr>`;}).join("");
  body.innerHTML=`<table><thead><tr><th>Obligation</th><th>Due</th><th>Timing</th><th>Status</th></tr></thead><tbody>${trs}</tbody></table>`;
}
function renderRisks(rows){
  document.getElementById("risk-count").textContent=rows.length?rows.length+" active":"";
  const body=document.getElementById("risk-body");
  if(!rows.length){body.innerHTML='<div class="empty"><strong>No active risks</strong>Nothing flagged on your agreements.</div>';return;}
  rows.sort((a,b)=>(b.severity||0)-(a.severity||0));
  const lab={3:"High",2:"Medium",1:"Low"};
  body.innerHTML=rows.map(r=>{
    const s=Math.max(1,Math.min(3,r.severity||1));
    return `<div class="risk"><div class="sev s${s}"></div><div class="risk-body">
      <div class="risk-top"><span class="risk-type">${esc((r.risk_type||"").replace(/_/g," "))}</span>
      <span class="sev-tag s${s}">${lab[s]}</span></div>
      <div class="risk-desc">${esc(r.description||"")}</div></div></div>`;}).join("");
}
function renderAgreements(rows){
  document.getElementById("agr-count").textContent=rows.length?rows.length+" total":"";
  const body=document.getElementById("agr-body");
  if(!rows.length){body.innerHTML='<div class="empty"><strong>No agreements</strong>Upload an agreement to get started.</div>';return;}
  const show=rows.slice(0,8);
  const trs=show.map(a=>{
    const lvl=(a.risk_level||"none").toLowerCase();
    const lvlCls=["high","medium","low"].includes(lvl)?lvl:"none";
    return `<tr>
      <td><span class="adoc">${esc(a.filename||a.id)}</span><div class="atype">${esc(a.agreement_type||"—")}</div></td>
      <td><span class="pill ${esc(a.status)}"><span class="dot"></span>${esc(a.status)}</span></td>
      <td><span class="rlevel ${lvlCls}"><span class="bar"><i></i></span>${lvl==="none"?"—":esc(lvl)}</span></td>
      <td class="due">${fmtDate(a.expiry_date)}</td></tr>`;}).join("");
  const more=rows.length>show.length?`<div class="empty" style="padding:14px 22px;text-align:left">+ ${rows.length-show.length} more</div>`:"";
  body.innerHTML=`<table><thead><tr><th>Agreement</th><th>Status</th><th>Risk</th><th>Expires</th></tr></thead><tbody>${trs}</tbody></table>${more}`;
}
(async function(){
  document.getElementById("asof").textContent="As of "+new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  try{
    const [summary,obligations,risks,agreements]=await Promise.all([
      getJSON("/dashboard/summary"),getJSON("/obligations"),getJSON("/risks"),getJSON("/agreements").catch(()=>[]),
    ]);
    const docMap={}; (agreements||[]).forEach(a=>{docMap[a.id]=a.filename||a.id;});
    renderSummary(summary); renderObligations(obligations||[],docMap); renderRisks(risks||[]); renderAgreements(agreements||[]);
    const app=document.getElementById("app"); app.classList.remove("loading"); app.classList.add("ready");
  }catch(e){
    if(e.message!=="unauth"){
      const app=document.getElementById("app"); app.classList.remove("loading"); app.classList.add("ready");
      document.getElementById("obl-body").innerHTML='<div class="empty"><strong>Could not load</strong>Check that you are signed in and the API is running.</div>';
    }
  }
})();
</script>
</body>
</html>
