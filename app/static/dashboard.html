<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AhadiIQ — Overview</title>
<link rel="icon" type="image/png" href="/static/ahadiiq-favicon-32.png">
<link rel="apple-touch-icon" href="/static/ahadiiq-favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#0FA3B1; --teal-deep:#0B818E; --ink:#0B3A42; --slate:#27333A;
    --bg:#F3F6F7; --surface:#FFFFFF; --line:#E6ECEE; --line-soft:#EEF2F4; --muted:#6A7881;
    --green:#2FB173; --green-soft:#E4F4EC; --amber:#C98A1B; --amber-soft:#F7EFDC;
    --red:#D2564B; --red-soft:#F8E7E4; --teal-soft:#E6F6F7;
    --nav:#0A3138; --nav-2:#0C4049; --nav-line:rgba(255,255,255,.09);
    --shadow:0 1px 2px rgba(11,58,66,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--slate);font-family:"Inter",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;}

  .layout{display:flex;align-items:stretch;min-height:100vh;}
  .sidebar{width:238px;flex:0 0 238px;background:linear-gradient(185deg,var(--nav),#072a30);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;color:#CFE3E6;}
  .brand{display:flex;align-items:center;gap:11px;padding:22px 22px 24px;}
  .brand .mk{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,#15C0CF,#0B818E);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.25);flex:0 0 auto;}
  .brand .nm{font-weight:700;font-size:20px;letter-spacing:-.02em;color:#fff;}
  .brand .nm .iq{color:#4FD6E0;}
  .nav{padding:6px 12px;display:flex;flex-direction:column;gap:2px;}
  .nav-sec{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:rgba(207,227,230,.5);padding:14px 12px 7px;}
  .nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#BBD4D8;text-decoration:none;font-size:14.5px;font-weight:500;cursor:pointer;transition:background .14s,color .14s;}
  .nav a svg{width:18px;height:18px;flex:0 0 auto;opacity:.85;}
  .nav a:hover{background:var(--nav-2);color:#fff;}
  .nav a.active{background:var(--teal);color:#fff;}
  .nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:1px 8px;min-width:20px;text-align:center;}
  .nav a.alert .badge{background:var(--red);}
  .side-foot{margin-top:auto;padding:16px 16px 20px;border-top:1px solid var(--nav-line);}
  .side-logout{display:flex;align-items:center;gap:10px;color:#BBD4D8;text-decoration:none;font-size:14px;font-weight:500;padding:8px 10px;border-radius:8px;transition:background .14s,color .14s;}
  .side-logout:hover{background:var(--nav-2);color:#fff;}

  .main{flex:1 1 auto;min-width:0;}
  .main-inner{max-width:1080px;margin:0 auto;padding:30px 36px 72px;}
  .page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
  .page-head .ttl h1{font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;color:var(--ink);}
  .page-head .ttl .asof{color:var(--muted);font-size:13px;margin-top:2px;}
  .btn-upload{background:var(--teal);color:#fff;border:none;border-radius:9px;font-family:inherit;font-weight:600;font-size:14px;padding:10px 17px;cursor:pointer;transition:background .15s,transform .05s;display:inline-flex;align-items:center;gap:8px;}
  .btn-upload:hover{background:var(--teal-deep);} .btn-upload:active{transform:translateY(1px);} .btn-upload:disabled{opacity:.6;cursor:default;}

  .strip{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;box-shadow:var(--shadow);margin-bottom:28px;}
  .stat{padding:18px 22px;border-left:1px solid var(--line-soft);cursor:pointer;transition:background .14s;position:relative;}
  .stat:first-child{border-left:0;}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .14s;}
  .stat:hover{background:#F7FBFB;} .stat:hover::before{background:var(--teal);}
  .stat .figure{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.025em;color:var(--ink);}
  .stat .label{margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:500;}
  .stat.alert .figure{color:var(--red);} .stat.alert::before{background:var(--red);} .stat.warn .figure{color:var(--amber);}

  section.block{scroll-margin-top:20px;margin-bottom:22px;}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 22px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;}
  .panel-head h2{font-weight:600;font-size:16px;letter-spacing:-.01em;margin:0;color:var(--ink);display:flex;align-items:center;gap:9px;}
  .panel-head h2 .ic{width:17px;height:17px;color:var(--teal);}
  .panel-head .count{font-size:12.5px;color:var(--muted);}
  .head-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .search{font-family:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--slate);width:220px;outline:none;transition:border-color .15s,box-shadow .15s;}
  .search::placeholder{color:var(--muted);} .search:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);}
  .chips{display:flex;gap:6px;}
  .chip{font-size:12.5px;font-weight:500;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .14s;}
  .chip:hover{color:var(--ink);} .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;}

  .orow{padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;gap:16px;}
  .orow:last-child{border-bottom:0;} .orow.over{background:var(--red-soft);}
  .o-main{flex:1 1 auto;min-width:0;}
  .o-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .otype{font-weight:600;text-transform:capitalize;color:var(--ink);}
  .o-doc{font-size:12.5px;color:var(--teal-deep);cursor:pointer;border-bottom:1px dotted rgba(11,129,142,.4);}
  .o-doc:hover{color:var(--teal);border-bottom-style:solid;}
  .o-side{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
  .due{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);font-size:14px;}
  .timing{font-size:12.5px;} .timing.over{color:var(--red);font-weight:600;} .timing.soon{color:var(--amber);font-weight:600;} .timing.calm{color:var(--muted);}
  .act{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:7px;border:1px solid var(--teal);background:#fff;color:var(--teal-deep);cursor:pointer;transition:all .14s;white-space:nowrap;}
  .act:hover{background:var(--teal);color:#fff;}

  /* clause "why" — editorial quote, not a boxed card */
  .why{margin-top:9px;position:relative;padding-left:30px;}
  .why::before{content:"\201C";position:absolute;left:2px;top:-6px;font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1;color:var(--teal);opacity:.45;}
  .why .wl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--teal-deep);font-weight:700;display:block;margin-bottom:1px;}
  .why .wt{font-size:13px;color:var(--slate);line-height:1.5;}

  .risk{padding:16px 22px;border-bottom:1px solid var(--line-soft);display:flex;gap:14px;align-items:flex-start;justify-content:space-between;}
  .risk:last-child{border-bottom:0;}
  .risk-body{min-width:0;flex:1 1 auto;}
  .risk-top{display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-wrap:wrap;}
  .risk-type{font-weight:600;text-transform:capitalize;color:var(--ink);font-size:14.5px;}
  .sev-tag{font-size:10.5px;letter-spacing:.03em;padding:3px 10px;border-radius:7px;font-weight:700;text-transform:uppercase;color:#fff;display:inline-flex;align-items:center;gap:6px;}
  .sev-tag::before{content:"";width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.9);}
  .sev-tag.s3{background:var(--red);} .sev-tag.s2{background:var(--amber);} .sev-tag.s1{background:var(--green);}
  .more{color:var(--teal-deep);font-weight:600;cursor:pointer;white-space:nowrap;}
  .more:hover{color:var(--teal);text-decoration:underline;}
  .risk-doc{font-size:12.5px;color:var(--teal-deep);cursor:pointer;border-bottom:1px dotted rgba(11,129,142,.4);}
  .risk-doc:hover{color:var(--teal);border-bottom-style:solid;}
  .risk-desc{font-size:13.5px;color:var(--slate);line-height:1.5;margin:3px 0 0;}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--slate);background:#fff;text-transform:capitalize;}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--muted);}
  .pill.pending .dot{background:var(--amber);} .pill.completed .dot{background:var(--green);} .pill.validated .dot{background:var(--green);} .pill.processing .dot{background:var(--teal);animation:pulse 1.2s ease-in-out infinite;} .pill.uploaded .dot{background:var(--muted);} .pill.resolved .dot{background:var(--green);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:11px 22px;border-bottom:1px solid var(--line-soft);}
  tbody td{padding:14px 22px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  .agreements tbody tr{transition:background .12s ease;cursor:pointer;}
  .agreements tbody tr:hover td{background:#F3FAFB;}
  .adoc{font-weight:600;font-size:15px;color:var(--ink);}
  .abrief{color:var(--muted);font-size:13px;margin-top:2px;} .asign{color:var(--muted);font-size:12px;margin-top:2px;}
  .viewd{color:var(--teal-deep);font-weight:600;font-size:13px;white-space:nowrap;}
  .rlevel{display:inline-flex;align-items:center;gap:7px;font-size:13px;text-transform:capitalize;}
  .rlevel .bar{width:28px;height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden;}
  .rlevel .bar i{position:absolute;left:0;top:0;bottom:0;}
  .rlevel.high .bar i{background:var(--red);width:100%;} .rlevel.medium .bar i{background:var(--amber);width:66%;} .rlevel.low .bar i{background:var(--green);width:33%;} .rlevel.none{color:var(--muted);}

  /* pager */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .pg-ctrl{display:flex;align-items:center;gap:8px;}
  .pg-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;color:var(--ink);font-size:16px;line-height:1;transition:all .14s;}
  .pg-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal-deep);} .pg-btn:disabled{opacity:.4;cursor:default;}
  .pg-now{min-width:86px;text-align:center;color:var(--slate);}
  .pg-size{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--slate);cursor:pointer;}

  .empty{padding:40px 22px;text-align:center;color:var(--muted);font-size:14px;}
  .empty strong{display:block;color:var(--ink);font-weight:700;margin-bottom:4px;font-size:16px;}

  /* detail drawer */
  .scrim{position:fixed;inset:0;background:rgba(11,58,66,.42);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;}
  .scrim.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,96vw);background:var(--surface);box-shadow:-12px 0 48px rgba(11,58,66,.22);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:61;display:flex;flex-direction:column;}
  .drawer.show{transform:translateX(0);}
  .dr-head{padding:22px 26px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .dr-eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-deep);font-weight:700;}
  .dr-title{font-weight:700;font-size:19px;color:var(--ink);letter-spacing:-.01em;margin-top:5px;}
  .dr-sub{font-size:13px;color:var(--muted);margin-top:4px;}
  .dr-close{background:none;border:none;cursor:pointer;color:var(--muted);font-size:24px;line-height:1;padding:0 6px;border-radius:6px;}
  .dr-close:hover{background:var(--bg);color:var(--ink);}
  .dr-body{padding:22px 26px;overflow-y:auto;flex:1;}
  .dr-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px;margin-bottom:8px;padding-bottom:20px;border-bottom:1px solid var(--line-soft);}
  .dr-field .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;}
  .dr-field .v{font-size:14px;color:var(--ink);margin-top:4px;}
  .dr-sec{font-weight:600;font-size:14px;color:var(--ink);margin:22px 0 10px;display:flex;align-items:center;gap:8px;}
  .dr-sec .n{font-size:12px;color:var(--muted);font-weight:500;}
  .dr-empty{font-size:13px;color:var(--muted);padding:6px 0 2px;}
  .dr-item{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:10px;}
  .dr-item .di-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .dr-item .di-name{font-weight:600;color:var(--ink);text-transform:capitalize;}
  .dr-item .di-meta{font-size:12.5px;color:var(--muted);}
  .dr-actions{display:flex;align-items:center;gap:10px;margin:2px 0 20px;flex-wrap:wrap;}
  .btn-dl{display:inline-flex;align-items:center;gap:8px;background:var(--teal);color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:9px;transition:background .15s;}
  .btn-dl:hover{background:var(--teal-deep);}
  .di-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:6px;}
  .di-status.pending{background:var(--amber-soft);color:var(--amber);}
  .di-status.completed,.di-status.resolved{background:var(--green-soft);color:var(--green);}
  .di-status.active{background:var(--red-soft);color:var(--red);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(11,58,66,.28);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:70;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);} .toast.err{background:var(--red);} .toast.ok{background:var(--green);}
  .loading{opacity:0;} .ready{opacity:1;transition:opacity .25s ease;}
  @media (prefers-reduced-motion:reduce){html,body{scroll-behavior:auto;}.ready,.drawer{transition:none;}}

  @media (max-width:880px){
    .layout{flex-direction:column;}
    .sidebar{width:100%;flex:none;height:auto;position:sticky;top:0;z-index:20;}
    .brand{padding:14px 18px;}
    .nav{flex-direction:row;overflow-x:auto;padding:0 10px 8px;gap:4px;}
    .nav-sec{display:none;} .nav a{white-space:nowrap;padding:8px 12px;} .nav .badge{display:none;}
    .side-foot{position:absolute;top:14px;right:16px;padding:0;border:0;margin:0;}
    .main-inner{padding:22px 18px 60px;}
    .strip{grid-template-columns:repeat(2,1fr);}
    .stat:nth-child(3){border-left:0;} .stat:nth-child(n+3){border-top:1px solid var(--line-soft);}
    .orow{flex-direction:column;gap:10px;} .o-side{text-align:left;align-items:flex-start;flex-direction:row;flex-wrap:wrap;}
    .dr-meta{grid-template-columns:1fr;}
  }
  @media (max-width:460px){.strip{grid-template-columns:1fr 1fr;}.search{width:150px;}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span class="mk"><svg width="19" height="19" viewBox="0 0 40 40" fill="none"><path d="M7 21.5 L16 30 L33 11" stroke="#fff" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="nm">Ahadi<span class="iq">IQ</span></span></div>
    <nav class="nav">
      <div class="nav-sec">Workspace</div>
      <a class="active" data-go="#top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Overview</a>
      <a data-go="#sec-obligations"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Obligations<span class="badge" id="nav-obl">0</span></a>
      <a id="nav-risks-a" data-go="#sec-risks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg>Risks<span class="badge" id="nav-risk">0</span></a>
      <a data-go="#sec-agreements"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Agreements<span class="badge" id="nav-agr">0</span></a>
    </nav>
    <div class="side-foot"><a class="side-logout" href="/auth/logout"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>Log out</a></div>
  </aside>

  <div class="main" id="top">
    <div id="app" class="main-inner loading">
      <div class="page-head">
        <div class="ttl"><h1>Overview</h1><div class="asof" id="asof"></div></div>
        <button class="btn-upload" id="uploadBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V7M6 11l6-6 6 6"/><path d="M5 21h14"/></svg>Upload agreement</button>
        <input type="file" id="fileInput" accept="application/pdf" hidden>
      </div>

      <section class="strip" aria-label="Summary">
        <div class="stat" data-go="#sec-agreements"><div class="figure num" id="s-agreements">—</div><div class="label">Agreements</div></div>
        <div class="stat" data-go="#sec-obligations"><div class="figure num" id="s-pending">—</div><div class="label">Pending obligations</div></div>
        <div class="stat" id="stat-overdue" data-go="#sec-obligations"><div class="figure num" id="s-overdue">—</div><div class="label">Overdue</div></div>
        <div class="stat" id="stat-risk" data-go="#sec-risks"><div class="figure num" id="s-risk">—</div><div class="label">High-risk agreements</div></div>
      </section>

      <section class="block" id="sec-obligations"><div class="panel">
        <div class="panel-head"><h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Obligations</h2><span class="count" id="obl-count"></span></div>
        <div id="obl-body"><div class="empty">Loading…</div></div>
      </div></section>

      <section class="block" id="sec-risks"><div class="panel">
        <div class="panel-head"><h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg>Risks</h2>
          <div class="head-right"><div class="chips" id="risk-chips"><span class="chip on" data-sev="all">All</span><span class="chip" data-sev="3">High</span><span class="chip" data-sev="2">Medium</span><span class="chip" data-sev="1">Low</span></div><span class="count" id="risk-count"></span></div>
        </div>
        <div id="risk-body"><div class="empty">Loading…</div></div>
      </div></section>

      <section class="block" id="sec-agreements"><div class="panel agreements">
        <div class="panel-head"><h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Agreements</h2>
          <div class="head-right"><input class="search" id="agr-search" type="search" placeholder="Search by name or party…"><span class="count" id="agr-count"></span></div>
        </div>
        <div id="agr-body"><div class="empty">Loading…</div></div>
      </div></section>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head">
    <div><div class="dr-eyebrow">Agreement</div><div class="dr-title" id="dr-title"></div><div class="dr-sub" id="dr-sub"></div></div>
    <button class="dr-close" id="dr-close" aria-label="Close">&times;</button>
  </div>
  <div class="dr-body" id="dr-body"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
const fmtDate = iso => { if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}); };
const daysUntil = iso => { if(!iso) return null; const d=new Date(iso+"T00:00:00"),t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/86400000); };
const esc = s => (s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap = s => (s? s.charAt(0).toUpperCase()+s.slice(1) : s);
const clip = (s,n)=>{ s=(s||"").trim(); return s.length>n ? s.slice(0,n).trim()+"…" : s; };
function people(p){ if(!p) return ""; if(Array.isArray(p)) return p.map(x=>typeof x==="string"?x:(x.name||x.party||Object.values(x)[0]||"")).filter(Boolean).join(" & "); if(typeof p==="object") return Object.values(p).map(v=>typeof v==="string"?v:"").filter(Boolean).join(" & "); return String(p); }
async function getJSON(path){ const r=await fetch(path,{credentials:"same-origin"}); if(r.status===401){window.location="/auth/login";throw new Error("unauth");} if(!r.ok) throw new Error(path+" "+r.status); return r.json(); }

let AGR_MAP={}, AGR_FULL={}, ALL_AGREEMENTS=[], ALL_RISKS=[], ALL_OBLIGATIONS=[], RISK_SEV="all";
const PAGE={obl:{page:1,size:7}, risk:{page:1,size:7}, agr:{page:1,size:7}};

function paginate(rows,key){ const st=PAGE[key]; const n=rows.length; const pages=Math.max(1,Math.ceil(n/st.size)); if(st.page>pages) st.page=pages; if(st.page<1) st.page=1; const start=(st.page-1)*st.size; return {slice:rows.slice(start,start+st.size),pages,n,start}; }
function pagerHTML(key,pages,n,start,shown){ const st=PAGE[key];
  return `<div class="pager"><span class="pg-info">${n? (start+1)+'–'+(start+shown)+' of '+n : '0 items'}</span>
    <div class="pg-ctrl">
      <button class="pg-btn" data-pg="${key}" data-dir="prev" ${st.page<=1?'disabled':''}>&lsaquo;</button>
      <span class="pg-now">Page ${st.page} / ${pages}</span>
      <button class="pg-btn" data-pg="${key}" data-dir="next" ${st.page>=pages?'disabled':''}>&rsaquo;</button>
      <select class="pg-size" data-pg="${key}">${[5,7,10,20].map(s=>`<option value="${s}" ${s===st.size?'selected':''}>${s} / page</option>`).join('')}</select>
    </div></div>`;
}
function docLabel(id){ const a=AGR_MAP[id]; if(!a) return esc(id); return `<span class="o-doc" data-detail="${id}">${esc(a.name)}${a.parties?' · '+esc(a.parties):''}</span>`; }
function timingCell(iso,status){ const n=daysUntil(iso); if(n===null) return '<span class="timing calm">No date</span>'; if(status!=="completed"&&n<0) return `<span class="timing over">Overdue ${Math.abs(n)}d</span>`; if(n<=30) return `<span class="timing soon">in ${n}d</span>`; return `<span class="timing calm">in ${n}d</span>`; }
function whyBlock(label,text,detailId,full){
  if(!text) return ""; const t=text.trim();
  if(full) return `<div class="why"><span class="wl">${label}</span><span class="wt">${esc(t)}</span></div>`;
  const short=clip(t,150);
  const more=(detailId && t.length>150) ? ` <span class="more" data-detail="${detailId}">more &rsaquo;</span>` : "";
  return `<div class="why"><span class="wl">${label}</span><span class="wt">${esc(short)}${more}</span></div>`;
}

function renderSummary(s){
  document.getElementById("s-agreements").textContent=s.total_agreements??0;
  document.getElementById("s-pending").textContent=s.pending_obligations??0;
  const ov=s.overdue_obligations??0, hr=s.high_risk_agreements??0;
  document.getElementById("s-overdue").textContent=ov; document.getElementById("s-risk").textContent=hr;
  document.getElementById("stat-overdue").classList.toggle("alert",ov>0);
  document.getElementById("stat-risk").classList.toggle("warn",hr>0);
  document.getElementById("nav-agr").textContent=s.total_agreements??0;
}
function obRowHTML(o){
  const overdue=o.status!=="completed"&&daysUntil(o.due_date)!==null&&daysUntil(o.due_date)<0;
  return `<div class="orow ${overdue?'over':''}"><div class="o-main"><div class="o-title"><span class="otype">${esc(o.obligation_type)}</span>${docLabel(o.agreement_id)}</div>${whyBlock("Why",o.clause_text,o.agreement_id)}</div><div class="o-side"><span class="due">${fmtDate(o.due_date)}</span>${timingCell(o.due_date,o.status)}<button class="act" data-action="complete-obl" data-id="${o.id}">Mark done</button></div></div>`;
}
function renderObligations(){
  const rows=[...ALL_OBLIGATIONS].sort((a,b)=>(a.due_date||"9999").localeCompare(b.due_date||"9999"));
  document.getElementById("obl-count").textContent=rows.length?rows.length+" active":"";
  document.getElementById("nav-obl").textContent=rows.length;
  const body=document.getElementById("obl-body");
  if(!rows.length){body.innerHTML='<div class="empty"><strong>Nothing due</strong>No active obligations — you are all clear.</div>';return;}
  const {slice,pages,n,start}=paginate(rows,"obl");
  body.innerHTML = slice.map(obRowHTML).join("") + pagerHTML("obl",pages,n,start,slice.length);
}
function riskRowHTML(r){
  const s=Math.max(1,Math.min(3,r.severity||1)); const lab={3:"High",2:"Medium",1:"Low"};
  return `<div class="risk"><div class="risk-body"><div class="risk-top"><span class="sev-tag s${s}">${lab[s]}</span><span class="risk-type">${esc((r.risk_type||"").replace(/_/g," "))}</span>${docLabel(r.agreement_id).replace('o-doc','risk-doc')}</div><p class="risk-desc">${esc(r.description||"")}</p>${whyBlock("In the contract",r.clause_text,r.agreement_id)}</div><button class="act" data-action="resolve-risk" data-id="${r.id}">Resolve</button></div>`;
}
function renderRisks(){
  let rows=RISK_SEV==="all"?ALL_RISKS:ALL_RISKS.filter(r=>String(r.severity)===RISK_SEV);
  rows=[...rows].sort((a,b)=>(b.severity||0)-(a.severity||0));
  document.getElementById("risk-count").textContent=ALL_RISKS.length?rows.length+" shown":"";
  document.getElementById("nav-risk").textContent=ALL_RISKS.length;
  document.getElementById("nav-risks-a").classList.toggle("alert",ALL_RISKS.some(r=>r.severity>=3));
  const body=document.getElementById("risk-body");
  if(!ALL_RISKS.length){body.innerHTML='<div class="empty"><strong>No active risks</strong>Nothing flagged on your agreements.</div>';return;}
  if(!rows.length){body.innerHTML='<div class="empty">No risks at this level.</div>';return;}
  const {slice,pages,n,start}=paginate(rows,"risk");
  body.innerHTML = slice.map(riskRowHTML).join("") + pagerHTML("risk",pages,n,start,slice.length);
}
function briefLine(a){ const parts=[]; if(a.agreement_type) parts.push(cap(a.agreement_type)); const p=people(a.parties); if(p) parts.push(p); if(a.expiry_date) parts.push("expires "+fmtDate(a.expiry_date)); return parts.join(" · ")||"—"; }
function renderAgreements(){
  const q=(document.getElementById("agr-search").value||"").trim().toLowerCase();
  let rows=ALL_AGREEMENTS;
  if(q) rows=rows.filter(a=>(a.filename||"").toLowerCase().includes(q)||(a.agreement_type||"").toLowerCase().includes(q)||people(a.parties).toLowerCase().includes(q));
  document.getElementById("agr-count").textContent=rows.length+(q?" found":" total");
  const body=document.getElementById("agr-body");
  if(!ALL_AGREEMENTS.length){body.innerHTML='<div class="empty"><strong>No agreements</strong>Upload an agreement to get started.</div>';return;}
  if(!rows.length){body.innerHTML='<div class="empty"><strong>No matches</strong>No contracts match that search.</div>';return;}
  const {slice,pages,n,start}=paginate(rows,"agr");
  const trs=slice.map(a=>{
    const lvl=(a.risk_level||"none").toLowerCase(); const lvlCls=["high","medium","low"].includes(lvl)?lvl:"none"; const sign=people(a.signatories);
    return `<tr data-detail="${a.id}"><td><span class="adoc">${esc(a.filename||a.id)}</span><div class="abrief">${esc(briefLine(a))}</div>${sign?`<div class="asign">Signed by ${esc(sign)}</div>`:""}</td><td><span class="pill ${esc(a.status)}"><span class="dot"></span>${esc(a.status)}</span></td><td><span class="rlevel ${lvlCls}"><span class="bar"><i></i></span>${lvl==="none"?"—":esc(lvl)}</span></td><td class="due">${fmtDate(a.expiry_date)}</td><td class="viewd">View details &rsaquo;</td></tr>`;}).join("");
  body.innerHTML=`<table><thead><tr><th>Agreement</th><th>Status</th><th>Risk</th><th>Expires</th><th></th></tr></thead><tbody>${trs}</tbody></table>`+pagerHTML("agr",pages,n,start,slice.length);
}

// ---- detail drawer ----
const scrim=document.getElementById("scrim"), drawer=document.getElementById("drawer");
function field(k,v){ return `<div class="dr-field"><div class="k">${k}</div><div class="v">${esc(v||"—")}</div></div>`; }
async function openDetail(id){
  const a=AGR_FULL[id];
  document.getElementById("dr-title").textContent = a? (a.filename||id) : "Loading…";
  document.getElementById("dr-sub").textContent = a? briefLine(a) : "";
  document.getElementById("dr-body").innerHTML = '<div class="dr-empty">Loading…</div>';
  drawer.classList.add("show"); scrim.classList.add("show"); drawer.setAttribute("aria-hidden","false");
  try{ renderDetail(await getJSON("/agreements/"+id+"/detail")); }
  catch(e){ if(e.message!=="unauth") document.getElementById("dr-body").innerHTML='<div class="dr-empty">Could not load contract details.</div>'; }
}
function renderDetail(d){
  document.getElementById("dr-title").textContent = d.filename || d.id;
  document.getElementById("dr-sub").textContent = briefLine(d);
  const obl=d.obligations||[], rsk=d.risks||[];
  const meta=`<div class="dr-actions"><a class="btn-dl" href="/agreements/${d.id}/download"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v12M6 13l6 6 6-6"/><path d="M5 21h14"/></svg>Download contract</a></div>
  <div class="dr-meta">
    ${field("Type",cap(d.agreement_type))}
    ${field("Status",cap(d.status))}
    ${field("Risk level",d.risk_level? cap(d.risk_level)+(d.risk_score!=null?` · score ${d.risk_score}`:"") : "—")}
    ${field("Expires",fmtDate(d.expiry_date))}
    ${field("Parties",people(d.parties))}
    ${field("Signatories",people(d.signatories))}
  </div>`;
  const oblH = `<div class="dr-sec">Obligations <span class="n">${obl.length}</span></div>` + (obl.length? obl.map(o=>{
    const n=daysUntil(o.due_date); const timing = o.status==="completed" ? 'done' : (n!=null ? (n<0?'<b style="color:var(--red)">overdue</b>':'in '+n+'d') : '—');
    const btn = o.status!=="completed" ? `<div style="margin-top:9px"><button class="act" data-action="complete-obl" data-id="${o.id}">Mark done</button></div>` : "";
    return `<div class="dr-item"><div class="di-top"><span class="di-name">${esc(o.obligation_type)} <span class="di-status ${esc(o.status)}">${esc(o.status)}</span></span><span class="di-meta">${fmtDate(o.due_date)} · ${timing}</span></div>${whyBlock("Why",o.clause_text,null,true)}${btn}</div>`;
  }).join("") : '<div class="dr-empty">No obligations on this agreement.</div>');
  const rskH = `<div class="dr-sec">Risks <span class="n">${rsk.length}</span></div>` + (rsk.length? rsk.map(r=>{
    const s=Math.max(1,Math.min(3,r.severity||1)); const lab={3:"High",2:"Medium",1:"Low"};
    const btn = r.status!=="resolved" ? `<div style="margin-top:9px"><button class="act" data-action="resolve-risk" data-id="${r.id}">Resolve</button></div>` : "";
    return `<div class="dr-item"><div class="di-top"><span class="di-name"><span class="sev-tag s${s}">${lab[s]}</span> ${esc((r.risk_type||"").replace(/_/g," "))} <span class="di-status ${esc(r.status)}">${esc(r.status)}</span></span></div><p class="risk-desc">${esc(r.description||"")}</p>${whyBlock("In the contract",r.clause_text,null,true)}${btn}</div>`;
  }).join("") : '<div class="dr-empty">No risks flagged.</div>');
  document.getElementById("dr-body").innerHTML=meta+oblH+rskH;
}
function closeDrawer(){ drawer.classList.remove("show"); scrim.classList.remove("show"); drawer.setAttribute("aria-hidden","true"); }
scrim.addEventListener("click",closeDrawer);
document.getElementById("dr-close").addEventListener("click",closeDrawer);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

// ---- toast + actions ----
const toast=document.getElementById("toast");
function showToast(msg,kind){toast.textContent=msg;toast.className="toast show "+(kind||"");setTimeout(()=>toast.classList.remove("show"),3200);}
async function patchStatus(path,bodyObj,okMsg){
  try{ const r=await fetch(path,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(bodyObj),credentials:"same-origin"});
    if(r.status===401){window.location="/auth/login";return;} if(!r.ok) throw new Error();
    showToast(okMsg,"ok"); loadAll(true);
  }catch(e){ showToast("Update failed. Please try again.","err"); }
}
document.addEventListener("click", e=>{
  const btn=e.target.closest("[data-action]");
  if(btn){ const id=btn.dataset.id;
    if(btn.dataset.action==="complete-obl") patchStatus("/obligations/"+id,{status:"completed"},"Obligation marked done");
    if(btn.dataset.action==="resolve-risk") patchStatus("/risks/"+id,{status:"resolved"},"Risk resolved");
    return; }
  const det=e.target.closest("[data-detail]"); if(det){ openDetail(det.dataset.detail); return; }
  const pg=e.target.closest(".pg-btn"); if(pg){ const k=pg.dataset.pg; PAGE[k].page += (pg.dataset.dir==="next"?1:-1); rerender(k); return; }
  const go=e.target.closest("[data-go]");
  if(go){ e.preventDefault(); const el=document.querySelector(go.dataset.go); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); document.querySelectorAll(".nav a").forEach(a=>a.classList.toggle("active",a===go.closest(".nav a"))); }
});
document.addEventListener("change", e=>{
  const sz=e.target.closest(".pg-size"); if(sz){ const k=sz.dataset.pg; PAGE[k].size=parseInt(sz.value,10); PAGE[k].page=1; rerender(k); }
});
function rerender(k){ if(k==="obl")renderObligations(); else if(k==="risk")renderRisks(); else renderAgreements(); }
document.getElementById("risk-chips").addEventListener("click", e=>{ const c=e.target.closest(".chip"); if(!c) return; RISK_SEV=c.dataset.sev; PAGE.risk.page=1; document.querySelectorAll("#risk-chips .chip").forEach(x=>x.classList.toggle("on",x===c)); renderRisks(); });
document.getElementById("agr-search").addEventListener("input", ()=>{ PAGE.agr.page=1; renderAgreements(); });

const uploadBtn=document.getElementById("uploadBtn"), fileInput=document.getElementById("fileInput");
uploadBtn.addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",async()=>{
  const f=fileInput.files[0]; if(!f) return;
  if(f.type!=="application/pdf"){showToast("Only PDF files are allowed.","err");fileInput.value="";return;}
  uploadBtn.disabled=true; uploadBtn.textContent="Uploading…";
  try{ const fd=new FormData(); fd.append("file",f);
    const r=await fetch("/upload_agreement",{method:"POST",body:fd,credentials:"same-origin"});
    if(r.status===401){window.location="/auth/login";return;} if(!r.ok) throw new Error(await r.text()||r.status);
    showToast("Uploaded. Processing has begun.","ok"); setTimeout(()=>loadAll(true),800);
  }catch(e){ showToast("Upload failed. Please try again.","err"); }
  finally{ uploadBtn.disabled=false; uploadBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V7M6 11l6-6 6 6"/><path d="M5 21h14"/></svg>Upload agreement'; fileInput.value=""; }
});

async function loadAll(silent){
  try{
    const [summary,obligations,risks,agreements]=await Promise.all([ getJSON("/dashboard/summary"),getJSON("/obligations"),getJSON("/risks"),getJSON("/agreements").catch(()=>[]) ]);
    AGR_MAP={}; AGR_FULL={}; (agreements||[]).forEach(a=>{AGR_MAP[a.id]={name:a.filename||a.id,parties:people(a.parties)};AGR_FULL[a.id]=a;});
    ALL_OBLIGATIONS=obligations||[]; ALL_RISKS=risks||[]; ALL_AGREEMENTS=agreements||[];
    renderSummary(summary); renderObligations(); renderRisks(); renderAgreements();
    const app=document.getElementById("app"); app.classList.remove("loading"); app.classList.add("ready");
  }catch(e){ if(!silent && e.message!=="unauth"){ const app=document.getElementById("app"); app.classList.remove("loading"); app.classList.add("ready"); document.getElementById("obl-body").innerHTML='<div class="empty"><strong>Could not load</strong>Check that you are signed in and the API is running.</div>'; } }
}
document.getElementById("asof").textContent="As of "+new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
loadAll(false);
setInterval(()=>loadAll(true),25000);
</script>
</body>
</html>
